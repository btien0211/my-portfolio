<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đèn Kéo Quân - 3D Carousel</title>
    <link rel="stylesheet" href="css/style.css"> 
    
    <style>
        /* CSS Riêng cho trang này để ghi đè style chung */
        body {
            background-color: #0d0d0d;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            height: 100vh;
        }

        h2 { margin-top: 30px; color: #d4af37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }

        .back-btn {
            position: absolute; top: 20px; left: 20px;
            color: #d4af37; border: 1px solid #d4af37;
            padding: 8px 16px; text-decoration: none; border-radius: 4px;
        }
        .back-btn:hover { background: #d4af37; color: #000; }

        .scene {
            width: 210px; height: 140px; position: relative;
            perspective: 1000px; margin-top: 100px;
        }

        .carousel {
            width: 100%; height: 100%; position: absolute;
            transform-style: preserve-3d;
            animation: rotateLantern 15s infinite linear;
        }

        .carousel-item {
            position: absolute; width: 190px; height: 140px;
            left: 10px; top: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #d4af37;
            display: flex; align-items: center; justify-content: center;
        }
        .carousel-item img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }

        /* Vị trí 6 mặt */
        .carousel-item:nth-child(1) { transform: rotateY(0deg) translateZ(190px); }
        .carousel-item:nth-child(2) { transform: rotateY(60deg) translateZ(190px); }
        .carousel-item:nth-child(3) { transform: rotateY(120deg) translateZ(190px); }
        .carousel-item:nth-child(4) { transform: rotateY(180deg) translateZ(190px); }
        .carousel-item:nth-child(5) { transform: rotateY(240deg) translateZ(190px); }
        .carousel-item:nth-child(6) { transform: rotateY(300deg) translateZ(190px); }

        @keyframes rotateLantern { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Quay lại Portfolio</a>
    <h2>Đèn Kéo Quân</h2>

    <div class="scene">
        <div class="carousel" id="lantern">
            <div class="carousel-item"><img src="https://picsum.photos/id/10/300/200"></div>
            <div class="carousel-item"><img src="https://picsum.photos/id/20/300/200"></div>
            <div class="carousel-item"><img src="https://picsum.photos/id/30/300/200"></div>
            <div class="carousel-item"><img src="https://picsum.photos/id/40/300/200"></div>
            <div class="carousel-item"><img src="https://picsum.photos/id/50/300/200"></div>
            <div class="carousel-item"><img src="https://picsum.photos/id/60/300/200"></div>
        </div>
    </div>
    <script>
        const lantern = document.getElementById('lantern');
        lantern.addEventListener('mouseenter', () => lantern.style.animationPlayState = 'paused');
        lantern.addEventListener('mouseleave', () => lantern.style.animationPlayState = 'running');
    </script>
</body>
</html>
