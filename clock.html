<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đồng Hồ Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1e1e1e;
            color: #fff; display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; font-family: 'Orbitron', sans-serif;
            flex-direction: column;
        }
        .clock-container {
            padding: 40px 60px; border: 4px solid #00f2ff; border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.5); background: #000; text-align: center;
        }
        #time { font-size: 80px; color: #00f2ff; text-shadow: 0 0 20px rgba(0, 242, 255, 0.8); }
        #date { font-size: 24px; color: #aaa; margin-top: 10px; letter-spacing: 3px; }
        .back-btn {
            margin-top: 30px; color: #00f2ff; text-decoration: none; border: 1px solid #00f2ff;
            padding: 10px 20px; border-radius: 5px; transition: 0.3s; font-family: sans-serif;
        }
        .back-btn:hover { background: #00f2ff; color: #000; }
    </style>
</head>
<body>
    <div class="clock-container">
        <div id="time">00:00:00</div>
        <div id="date">Đang tải...</div>
    </div>
    <a href="index.html" class="back-btn">← Quay lại Portfolio</a>

    <script>
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById("time").innerText = `${h}:${m}:${s}`;
            
            const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            const dateStr = `${days[now.getDay()]}, ${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()}`;
            document.getElementById("date").innerText = dateStr;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
