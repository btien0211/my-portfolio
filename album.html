<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Ảnh Kỷ Niệm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background-color: #f0f2f5; }
        .gallery-item img { 
            width: 100%; height: 250px; object-fit: cover; 
            border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .gallery-item img:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .modal-content { background: #000; border: 1px solid #444; }
        .close { color: #fff; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="font-weight-bold">📸 Album Ảnh Của Tôi</h1>
            <a href="index.html" class="btn btn-outline-primary mt-3">← Quay lại Portfolio</a>
        </div>
        
        <div class="row">
            <div class="col-md-4 mb-4 gallery-item">
                <img src="https://picsum.photos/id/1015/400/300" data-src="https://picsum.photos/id/1015/1200/800" data-toggle="modal" data-target="#imgModal">
            </div>
            <div class="col-md-4 mb-4 gallery-item">
                <img src="https://picsum.photos/id/1025/400/300" data-src="https://picsum.photos/id/1025/1200/800" data-toggle="modal" data-target="#imgModal">
            </div>
            <div class="col-md-4 mb-4 gallery-item">
                <img src="https://picsum.photos/id/1035/400/300" data-src="https://picsum.photos/id/1035/1200/800" data-toggle="modal" data-target="#imgModal">
            </div>
        </div>
    </div>
    <div class="modal fade" id="imgModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body p-0">
                    <img id="modalImage" src="" class="img-fluid w-100">
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('img[data-toggle="modal"]').forEach(img => {
            img.addEventListener('click', function() {
                document.getElementById('modalImage').src = this.getAttribute('data-src');
            });
        });
    </script>
</body>
</html>
